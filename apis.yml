aid: insidesales-com
name: InsideSales (XANT / InsideSales.com)
description: >-
  InsideSales — branded XANT from 2019 until Aurea Software (ESW Capital) acquired the company in
  August 2021 and revived the original name — sells Playbooks, an AI-assisted sales engagement
  platform that layers cadence, automation, prioritization, scoring and call recording on top of a
  customer's existing CRM (Salesforce, Microsoft Dynamics, SAP) rather than replacing it. Its only
  publicly documented programmable surface is the Playbooks Call Recording API, an access-key
  protected service for downloading call recordings by Call Detail Record (CDR) ID and for
  starting/pausing recording from third-party applications; the company also publishes a first-party
  React UI component library on npm and GitHub. The developer surface is materially decayed: the API
  reference host and the call-recording host named in the company's own documentation no longer
  resolve in DNS, product release notes stop in July 2021, and the Atlassian status page is titled
  "Deprecated InsideSales".
