apis:
- name: Playbooks Call Recording API
  description: >-
    Access-key protected HTTP API that lets an organization or a third-party application download
    call recordings produced by Playbooks, and — with the second permission enabled — start and
    pause recording on a call. Recordings are addressed by Call Detail Record (CDR) ID, the
    identifier that appears at the end of the Playbooks Call Recording URL written back to the CRM.
    Access keys are minted by an administrator in the Playbooks Manager App under Settings > Calls >
    Call Recording; each key must carry at least one of the two permissions and permissions are
    immutable after creation. NOTE: the recording host published in the vendor's own documentation
    (callrecordings.insidesales.com) returns SERVFAIL and the API reference host
    (ci-global-api.pdlmpapis.insidesales.com) is likewise unresolvable as of 2026-08-23.
  humanURL: https://helpcenter.insidesales.com/playbooks/call-recording-api/
  baseURL: https://callrecordings.insidesales.com
