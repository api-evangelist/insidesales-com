decommissioned_surfaces:
  probed: '2026-08-23'
  note: >-
    Three hosts named in the company's own live documentation no longer resolve. These were probed
    against 1.1.1.1 and 8.8.8.8 and confirmed at the authoritative Route 53 nameservers for
    insidesales.com.
  hosts:
  - host: api.insidesales.com
    dns: NXDOMAIN
    record: CNAME tyk-gateway-103411294.us-east-1.elb.amazonaws.com
    detail: >-
      The CNAME survives; the AWS ELB it points at has been deleted (NXDOMAIN). A dangling CNAME
      into a deleted elastic load balancer is also a subdomain-takeover vector, and is reported to
      the provider as such.
  - host: callrecordings.insidesales.com
    dns: SERVFAIL
    detail: >-
      The host every Playbooks Call Recording URL is built on, per the live help article
      https://helpcenter.insidesales.com/playbooks/call-recording-api/ (example given there:
      https://callrecordings.insidesales.com?id=5858485).
  - host: ci-global-api.pdlmpapis.insidesales.com
    dns: SERVFAIL
    detail: >-
      The API reference. The live help article links it as "API Documentation can be found here".
      The parent zone pdlmpapis.insidesales.com also SERVFAILs, so the whole delegation is broken.
  - host: playbooksmanager.insidesales.com
    dns: NODATA
    record: CNAME d3d22imzfrt4mj.cloudfront.net
    detail: >-
      The Playbooks Manager App — where an administrator mints a Call Recording API access key.
      CNAME resolves to a CloudFront distribution that returns no address record.
