  date: '2021-07-09'
  title: July 9th, 2021 Product Update
  url: https://helpcenter.insidesales.com/releases/july-9th-2021-product-update/
  breaking: false
  additions:
  - >-
    Call Recording Control API — "A new set of APIs can be used to systematically start or stop a
    call recording", positioned for PCI-style compliance (stop recording while a credit-card form
    is open, resume after). Access gated: "To begin using this feature please contact your Customer
    Success Manager."
  - Calendar invite improvements — convert an email to a calendar invite; select a time from calendar view.
  - Inbound Call Paths menus raised from 4 to 10 options.
  - Computer-based Calling exits beta and becomes generally available.
  - Call recording controls extended from outbound-only to inbound calls.
