method: searched
source: https://helpcenter.insidesales.com/playbooks/call-recording-api/
note: >-
  There is no OpenAPI to derive from, so nothing here is inferred from a spec. Every field is either
  read from the company's own help center or recorded as not-published. The single API reference
  that would have carried the request/response conventions
  (ci-global-api.pdlmpapis.insidesales.com/apidoc/) is unreachable — DNS SERVFAIL as of 2026-08-23 —
  and the only Wayback capture of it archived an empty apiDoc.js shell with no api_data.js, so these
  conventions are not recoverable from any public source.
authentication:
  style: api-key
  detail: See authentication/insidesales-com-authentication.yml
  transport: not-published
idempotency:
  supported: unknown
  header: null
  scope: null
  retention: null
  note: >-
    Not documented. No Idempotency pointer is emitted in apis.yml — the provider publishes no
    idempotency contract, and claiming one would be a fabrication. The write surface (start/pause
    recording) is exactly the kind of operation where a retry contract matters.
pagination:
  style: not-applicable
  note: >-
    The only documented read operation retrieves one recording by CDR ID. No list or collection
    endpoint is published, so there is no pagination surface.
