  headers: none-published
  detail: See rate-limits/insidesales-com-rate-limits.yml
content_types:
  request: not-published
  response: >-
    Binary audio for a recording download is implied by the operation ("download call recordings")
    but no media type is stated anywhere in the public docs.
dry_run_mode:
  supported: false
  note: No sandbox, no test mode, no test tenant and no magic test values are published.
reversibility:
  applicable: true
  grade: undocumented
  credit: 0
  note: >-
    Playbooks has a real write surface — the Call Recording Control API can start and stop recording
    on a live call — so reversibility is applicable and cannot be marked `na`. It is graded
    `undocumented` rather than `documented`: no reversal operation, no undo, no window and no
    retention statement is published for any write. NO WINDOW IS ASSERTED HERE, because none exists
    to cite; inventing one on a call-recording compliance surface could cost a user a regulatory
    breach rather than money.
  write_surfaces:
  - operation: start call recording
    reversal: stop call recording
    reversal_is_documented: false
    window: null
    docs: https://helpcenter.insidesales.com/releases/july-9th-2021-product-update/
    note: >-
      The pair is described as self-inverse in prose ("cause XANT to stop recording the call while
      the credit card form is open, and then resume the recording when the credit card form is
      closed") but this is a product narrative, not a reversal contract: the docs never say whether
      the already-captured audio segment can be discarded, whether stopping mid-call truncates or
      splits the recording, or within what window either action can be undone.
  - operation: stop call recording
    reversal: start call recording
    reversal_is_documented: false
    window: null
  - operation: revoke access key (delete)
    reversal: none
    reversal_is_documented: false
    window: null
    note: >-
      Key deletion is explicitly the revocation mechanism and is irreversible; a key's permissions
      are also immutable after creation, so there is no corrective path short of minting a new key.
